# Conferência automática do portal: roda em cada pull request e em cada push na main.
# O resultado aparece no PR (✔ ou ✖) antes do merge. Para rodar à mão: aba Actions →
# Conferência → Run workflow.
name: Conferência

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Um push novo no mesmo PR cancela a conferência anterior.
concurrency:
  group: conferencia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conferir:
    name: Conferir o código
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Python 3.12 (o mesmo da imagem do portal)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar as dependências
        run: python -m pip install -r requirements.txt

      - name: Sintaxe do Python
        run: python -m compileall -q marketplace solucoes

      - name: Sintaxe do JavaScript
        run: |
          for f in marketplace/web/*.js; do
            node --check "$f"
          done

      - name: Manifestos das soluções
        run: python -m marketplace validar

      - name: Scripts shell (shellcheck)
        run: shellcheck -S warning deploy/*.sh deploy/supabase/volumes/api/envoy/docker-entrypoint.sh solucoes/*/*.sh

      # Só roda quando existir a pasta tests/ com testes (pytest).
      - name: Testes
        if: hashFiles('tests/**/*.py') != ''
        run: |
          python -m pip install pytest
          python -m pytest -q
