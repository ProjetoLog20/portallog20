# Manifesto de solucao do Portal LOG20.
# Copie esta pasta para publicar uma nova solucao e ajuste os campos.

id = "central-colaborador"
nome = "Central do Colaborador (Yuri)"
resumo = "Portal de RH com o assistente Yuri, prontuário, SKAP, produtividade e pesquisas."
categoria = "Recursos Humanos"
versao = "1.0.0"
responsavel = "LOG20"
tags = ["rh", "chatbot", "yuri"]
# Gerados automaticamente na primeira execucao e guardados em portal/dados/ (fora do git).
# Atencao: em TOML, campos soltos precisam vir ANTES da primeira [tabela].
segredos = ["JWT_SECRET"]
# Imagem quadrada (png, jpg, svg ou webp) dentro desta pasta.
logo = "logo.jpg"
descricao = """
Central do Colaborador da LOG20: login por matrícula, áreas para colaborador, motorista e administrador,
importação de planilhas e o Yuri, o assistente de RH com IA opcional.

Os dados ficam num banco próprio no PostgreSQL do servidor, criado pelo portal na primeira vez que o
sistema inicia; a cada início o portal aplica as migrações novas do sistema. O primeiro administrador é
criado uma vez, na VM: bash solucoes/central-colaborador/criar-admin.sh
"""

[build]
# O portal clona este repositorio (branch "ref") e constroi a imagem com o Dockerfile da raiz.
# Repositorio privado: defina PORTAL_GIT_TOKEN com um token de leitura.
repositorio = "https://github.com/ProjetoLog20/chatbot-rh-central-colaborador"
ref = "main"
dockerfile = "Dockerfile"
imagem = "log20/central-colaborador:local"

[execucao]
porta_container = 4000
porta_host = 8101
caminho_saude = "/api/health"
caminho_abrir = "/"
# A cada Iniciar/Atualizar, antes de trocar o container: aplica as migracoes novas do banco do
# servidor (o script do sistema guarda o que ja foi aplicado em schema_migrations). Se falhar, nada
# muda. Com outro banco nas configuracoes (ex.: Supabase), as migracoes ficam com quem cuida dele.
antes_de_iniciar = ["sh", "-c", "case \"$DATABASE_URL\" in *@log20-postgres:*) exec node backend/scripts/migrate.js ;; *) echo 'Banco fora do servidor: migracoes nao aplicadas pelo portal.' ;; esac"]

[execucao.ambiente]
NODE_ENV = "production"
PORT = "4000"
FRONTEND_URL = "{url}"
GEO_RESTRICTION_ENABLED = "false"

[execucao.volumes]
dados = "/app/backend/data"
uploads = "/app/backend/uploads"

# Banco no PostgreSQL do servidor: na primeira vez o portal cria o banco e o usuario da Central e
# preenche DATABASE_URL (so se ainda estiver vazia). Rede interna do Docker: sem SSL (sslmode=disable
# substitui o SSL que a Central liga sozinha em producao). Entra no backup diario com os outros bancos
# do servidor. Para usar outro banco (ex.: Supabase), troque DATABASE_URL; o portal nao sobrescreve.
[banco]
tipo = "postgres"

[banco.configuracoes]
DATABASE_URL = "{db_url}?sslmode=disable"

[[configuracoes]]
nome = "YURI_AI_ENABLED"
rotulo = "Ativar a IA do Yuri"
tipo = "booleano"
padrao = "false"
ajuda = "Desligada, o Yuri responde com a base cadastrada no painel do administrador."

[[configuracoes]]
nome = "OPENAI_API_KEY"
rotulo = "Chave da OpenAI"
tipo = "segredo"
ajuda = "Necessária só com a IA ativada. Fica guardada no portal e nunca vai para o navegador."

[[configuracoes]]
nome = "OPENAI_MODEL"
rotulo = "Modelo da OpenAI"
tipo = "texto"
padrao = "gpt-5-mini"

[[configuracoes]]
nome = "DATABASE_URL"
rotulo = "Banco PostgreSQL"
tipo = "segredo"
ajuda = "Preenchido pelo portal com o banco do servidor no primeiro início. Para usar outro banco (ex.: Supabase), cole aqui a string do Session pooler."

[[configuracoes]]
nome = "DATABASE_SSL_REJECT_UNAUTHORIZED"
rotulo = "Exigir certificado SSL reconhecido no banco"
tipo = "booleano"
padrao = "false"
ajuda = "Deixe desmarcado para o Supabase: o certificado dele é assinado pela própria autoridade do Supabase. A conexão continua criptografada."
