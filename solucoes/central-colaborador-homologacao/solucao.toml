# Manifesto de solucao do Portal LOG20.
# Copie esta pasta para publicar uma nova solucao e ajuste os campos.

id = "central-colaborador-homologacao"
nome = "Central do Colaborador - Homologação"
resumo = "Cópia do Yuri para testar mudanças e treinar a equipe sem mexer nos dados reais."
categoria = "Recursos Humanos"
versao = "1.0.0"
responsavel = "LOG20"
tags = ["rh", "chatbot", "yuri", "homologacao"]
# Gerados automaticamente na primeira execucao e guardados em portal/dados/ (fora do git).
# Atencao: em TOML, campos soltos precisam vir ANTES da primeira [tabela].
segredos = ["JWT_SECRET"]
# Sem logo: o portal mostra um monograma com as iniciais.
descricao = """
Ambiente de homologação da Central do Colaborador: mesma aplicação, com banco, usuários e configurações
separados da instância principal. Use para testar atualizações e treinar a equipe.

Nesta instalação local os dados ficam em SQLite, num volume Docker que é mantido quando o container é
parado, atualizado ou removido.
"""

[build]
# O portal clona este repositorio (branch "ref") e constroi a imagem com o Dockerfile da raiz.
# Repositorio privado: defina PORTAL_GIT_TOKEN com um token de leitura.
repositorio = "https://github.com/JungGustavo/yuri-central-colaborador.git"
ref = "main"
dockerfile = "Dockerfile"
# Mesma imagem da Central do Colaborador: o build e feito uma vez so.
# "Atualizar" em qualquer uma das duas reconstroi a imagem; a outra pega a versao nova ao reiniciar.
imagem = "log20/central-colaborador:local"

[execucao]
porta_container = 4000
porta_host = 8102
caminho_saude = "/api/health"
caminho_abrir = "/"

[execucao.ambiente]
NODE_ENV = "production"
PORT = "4000"
FRONTEND_URL = "{url}"
SEED_DEMO = "true"
GEO_RESTRICTION_ENABLED = "false"

[execucao.volumes]
dados = "/app/backend/data"
uploads = "/app/backend/uploads"

[[configuracoes]]
nome = "YURI_AI_ENABLED"
rotulo = "Ativar a IA do Yuri"
tipo = "booleano"
padrao = "false"
ajuda = "Desligada, o Yuri responde com a base cadastrada no painel do administrador."

[[configuracoes]]
nome = "OPENAI_API_KEY"
rotulo = "Chave da OpenAI"
tipo = "segredo"
ajuda = "Necessária só com a IA ativada. Fica guardada no portal e nunca vai para o navegador."

[[configuracoes]]
nome = "OPENAI_MODEL"
rotulo = "Modelo da OpenAI"
tipo = "texto"
padrao = "gpt-5-mini"

[[configuracoes]]
nome = "DATABASE_URL"
rotulo = "Banco PostgreSQL (opcional)"
tipo = "segredo"
ajuda = "Em branco usa SQLite local. Para Supabase, cole a connection string e rode as migrations antes."

[[acessos_demo]]
perfil = "Administrador"
usuario = "1000"
senha = "log20"

[[acessos_demo]]
perfil = "Motorista"
usuario = "2000"
senha = "log20"

[[acessos_demo]]
perfil = "Colaborador"
usuario = "3000"
senha = "log20"
