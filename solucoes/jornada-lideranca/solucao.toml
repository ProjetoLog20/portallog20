# Jornada da Liderança (Django). Codigo: fork JungGustavo/Jornada-da-lideranca, branch
# portal-log20 (main fica igual ao original, para receber as atualizacoes com "Sync fork").

id = "jornada-lideranca"
nome = "Jornada da Liderança"
resumo = "Ciclo de desenvolvimento das lideranças: avaliação, autoavaliação, feedback, PDI e check-in."
categoria = "Recursos Humanos"
versao = "1.0.0"
responsavel = "RH LOG20"
tags = ["rh", "lideranca", "django"]
segredos = ["SECRET_KEY"]
descricao = """
Registro do ciclo de desenvolvimento das lideranças da LOG20. O RH cadastra filiais,
colaboradores e ciclos; os líderes registram avaliação, feedback, PDI e check-in; o painel do RH
acompanha o andamento e exporta os dados.

Tem login próprio (e-mail e senha). A primeira conta do RH é criada ao iniciar, com o e-mail,
o nome e a senha preenchidos em Configurações. As demais contas são criadas dentro do sistema.

Os dados ficam no PostgreSQL do servidor, num banco só da Jornada (sem servidor de banco, num
SQLite local). Os dois são mantidos ao atualizar ou reiniciar.
"""

[build]
repositorio = "https://github.com/JungGustavo/Jornada-da-lideranca.git"
ref = "portal-log20"
dockerfile = "Dockerfile"

[execucao]
porta_container = 8000
porta_host = 8103
caminho_saude = "/saude/"
caminho_abrir = "/"
# Abrem sem login no portal: os links individuais de autoavaliacao que o RH envia aos
# colaboradores e os estilos da pagina. O resto exige login no portal e acesso liberado.
# (/autoavaliacao/minha/ e /exportar/ continuam exigindo o login do proprio sistema.)
caminhos_publicos = ["/autoavaliacao/*", "/static/*"]

[execucao.ambiente]
DEBUG = "False"
ALLOWED_HOSTS = "{host}"
CSRF_TRUSTED_ORIGINS = "{url}"
TZ = "America/Sao_Paulo"
# Servido por http:// num IP. Com domínio e HTTPS, troque para True e ligue CONFIAR_PROXY_HTTPS.
SECURE_SSL_REDIRECT = "False"
SESSION_COOKIE_SECURE = "False"
CSRF_COOKIE_SECURE = "False"
SECURE_HSTS_SECONDS = "0"
SECURE_HSTS_INCLUDE_SUBDOMAINS = "False"
SECURE_HSTS_PRELOAD = "False"
# Cookies com nome próprio: outros sistemas no mesmo IP (outras portas) recebem os mesmos cookies.
SESSION_COOKIE_NAME = "jornada_sessao"
CSRF_COOKIE_NAME = "jornada_csrf"

[execucao.volumes]
dados = "/app/data"

# Banco no PostgreSQL do servidor: na primeira instalacao o portal cria o banco e o usuario
# da Jornada e preenche os campos DB_* abaixo (so se ainda estiverem no padrao). Para usar
# outro banco (ex.: Supabase), troque os campos; o portal nao sobrescreve depois.
[banco]
tipo = "postgres"

[banco.configuracoes]
DB_HOST = "{db_host}"
DB_PORT = "{db_porta}"
DB_NAME = "{db_nome}"
DB_USER = "{db_usuario}"
DB_PASSWORD = "{db_senha}"
# Rede interna do Docker: a conexao nao sai da maquina.
DB_SSLMODE = "disable"

# Primeira conta do RH: criada sozinha ao iniciar, se ainda nao existir (a senha nao e
# sobrescrita depois). Dispensa o comando criar_usuario no terminal.
[[configuracoes]]
nome = "JORNADA_RH_EMAIL"
rotulo = "Primeira conta do RH: e-mail"
tipo = "texto"
ajuda = "Criada no próximo início se ainda não existir. Depois de criada, mudar estes campos não altera a conta."

[[configuracoes]]
nome = "JORNADA_RH_NOME"
rotulo = "Primeira conta do RH: nome"
tipo = "texto"

[[configuracoes]]
nome = "JORNADA_RH_SENHA"
rotulo = "Primeira conta do RH: senha"
tipo = "segredo"
ajuda = "Pelo menos 8 caracteres, sem ser só números nem parecida com o e-mail. Se for recusada, o motivo aparece nos logs."

[[configuracoes]]
nome = "LIDER_VE_AUTOAVALIACAO"
rotulo = "Líder vê a autoavaliação do colaborador"
tipo = "booleano"
padrao = "true"

[[configuracoes]]
nome = "EMAIL_BACKEND"
rotulo = "Envio de e-mail"
tipo = "texto"
padrao = "django.core.mail.backends.console.EmailBackend"
ajuda = "Padrão: os e-mails só aparecem nos logs. Para enviar de verdade, use django.core.mail.backends.smtp.EmailBackend e preencha o SMTP abaixo."

[[configuracoes]]
nome = "EMAIL_HOST"
rotulo = "Servidor SMTP"
tipo = "texto"
ajuda = "Ex.: smtp.office365.com. Dados fornecidos pela TI."

[[configuracoes]]
nome = "EMAIL_PORT"
rotulo = "Porta SMTP"
tipo = "texto"
padrao = "587"

[[configuracoes]]
nome = "EMAIL_HOST_USER"
rotulo = "Usuário SMTP"
tipo = "texto"

[[configuracoes]]
nome = "EMAIL_HOST_PASSWORD"
rotulo = "Senha SMTP"
tipo = "segredo"

[[configuracoes]]
nome = "DEFAULT_FROM_EMAIL"
rotulo = "Remetente"
tipo = "texto"
padrao = "Jornada da Liderança <noreply@log20.com.br>"

# Banco: em branco usa o SQLite do volume. Para PostgreSQL, preencha os campos abaixo OU a
# string de conexao (se a string estiver preenchida, ela vale no lugar dos campos).
[[configuracoes]]
nome = "DB_HOST"
rotulo = "Banco PostgreSQL: servidor"
tipo = "texto"
ajuda = "Preenchido pelo portal com o banco do servidor (log20-postgres). Para outro banco, troque aqui; ex.: Supabase, o host do Session pooler. Em branco, sem banco do servidor: SQLite local."

[[configuracoes]]
nome = "DB_PORT"
rotulo = "Banco PostgreSQL: porta"
tipo = "texto"
padrao = "5432"

[[configuracoes]]
nome = "DB_NAME"
rotulo = "Banco PostgreSQL: nome do banco"
tipo = "texto"
padrao = "postgres"

[[configuracoes]]
nome = "DB_USER"
rotulo = "Banco PostgreSQL: usuário"
tipo = "texto"
ajuda = "No pooler do Supabase o usuário vem com o código do projeto: postgres.xxxxxxxx."

[[configuracoes]]
nome = "DB_PASSWORD"
rotulo = "Banco PostgreSQL: senha"
tipo = "segredo"
ajuda = "Pode ter qualquer símbolo: não precisa codificar."

[[configuracoes]]
nome = "DB_SSLMODE"
rotulo = "Banco PostgreSQL: SSL"
tipo = "texto"
padrao = "require"
ajuda = "require para Supabase e bancos na nuvem; disable para um PostgreSQL local sem SSL."

[[configuracoes]]
nome = "DATABASE_URL"
rotulo = "Banco PostgreSQL: string de conexão (alternativa)"
tipo = "segredo"
ajuda = "Opcional, no lugar dos campos acima: postgresql://usuario:senha@servidor:5432/banco?sslmode=require. Símbolos na senha precisam ser codificados (# vira %23)."
