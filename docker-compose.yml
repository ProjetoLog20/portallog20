# Portal de Solucoes no servidor (ou numa VM de teste).
#
# Atalho: bash deploy/preparar-vm.sh  (instala o Docker, cria o .env, sobe tudo e cria o admin)
#
# Manual:
#   1. cp variaveis.exemplo .env   e ajuste o IP
#   2. docker compose up -d --build
#   3. docker compose exec portal python -m marketplace criar-admin
#
# Quem entra por onde:
#   http://<ip>:8000          portal (login, Meus sistemas, administracao)
#   http://<ip>:8101..8130    solucoes, sempre pelo Caddy, que pergunta ao portal se a pessoa pode entrar
# As solucoes nao abrem nenhuma porta propria: ficam so na rede interna "log20".
# A configuracao do Caddy e gerada pelo portal a partir dos manifestos (dados/caddy/Caddyfile):
# para publicar uma solucao basta o manifesto + "Recarregar catalogo"; nada aqui muda.

services:
  portal:
    build: .
    container_name: log20-portal
    restart: unless-stopped
    env_file: .env
    environment:
      PORTAL_HOST: 0.0.0.0
      # Solucoes criadas na rede interna, sem portas publicadas: so o Caddy chega nelas.
      PORTAL_REDE_DOCKER: log20
      PORTAL_PUBLICAR_PORTAS: "false"
      # O portal escreve o Caddyfile em dados/caddy e recarrega este container.
      PORTAL_CADDY_CONTAINER: log20-caddy
      # Mesma faixa publicada pelo servico caddy abaixo; manifestos fora dela sao recusados.
      PORTAL_FAIXA_PORTAS: "8101-8130"
      # Banco PostgreSQL do servidor: o portal cria um banco e um usuario por solucao que pedir
      # ([banco] no manifesto), via "docker exec" neste container.
      PORTAL_POSTGRES_CONTAINER: log20-postgres
    ports:
      - "8000:8000"
    networks:
      - log20
    volumes:
      # Acesso ao Docker da maquina para construir e iniciar as solucoes.
      # Atencao: quem administra o portal controla o Docker desta maquina.
      - /var/run/docker.sock:/var/run/docker.sock
      # Esta pasta (o clone do portal): codigo, manifestos em solucoes/ e dados em dados/.
      # O codigo das solucoes e clonado pelo portal em dados/fontes/.
      - .:/portal

  caddy:
    image: caddy:2
    container_name: log20-caddy
    restart: unless-stopped
    depends_on:
      - portal
    # Na primeira subida espera o portal gerar a configuracao.
    command:
      - sh
      - -c
      - >-
        until [ -f /etc/caddy/Caddyfile ]; do echo "Aguardando o portal gerar /etc/caddy/Caddyfile..."; sleep 2; done;
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    # Faixa reservada para as solucoes (uma porta por solucao, a "porta_host" do manifesto).
    # So as portas com solucao cadastrada respondem. Para ampliar, mude aqui e em PORTAL_FAIXA_PORTAS.
    ports:
      - "8101-8130:8101-8130"
    networks:
      - log20
    volumes:
      - ./dados/caddy:/etc/caddy:ro
      - caddy-dados:/data

  # Um PostgreSQL para as solucoes, so na rede interna (nenhuma porta aberta na maquina).
  # Cada solucao tem banco e usuario proprios; um nao le os dados do outro.
  # A senha do administrador do banco fica no .env (PORTAL_POSTGRES_SENHA, gerada pelos scripts)
  # e so vale na primeira subida, quando o volume e criado.
  postgres:
    image: postgres:17
    container_name: log20-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PORTAL_POSTGRES_SENHA:?defina PORTAL_POSTGRES_SENHA no .env (os scripts de deploy geram)}
      TZ: America/Sao_Paulo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - log20
    volumes:
      - postgres-dados:/var/lib/postgresql/data

networks:
  log20:
    name: log20

volumes:
  caddy-dados:
  postgres-dados:
    # Nome fixo: o backup e a restauracao acham o volume por ele.
    name: log20-postgres-dados
