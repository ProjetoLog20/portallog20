# Supabase do servidor, para sistemas feitos sobre o Supabase (ex.: Panorama).
#
# Ligado por PORTAL_SUPABASE=sim no .env do portal; quem sobe e o deploy/atualizar.sh (e o
# preparar-vm.sh), com:
#   docker compose -p log20-supabase -f deploy/supabase/docker-compose.yml --env-file .env up -d
#
# Baseado no compose oficial (github.com/supabase/supabase, pasta docker; commit em ORIGEM-COMMIT),
# so com o que os sistemas usam: banco, login (auth), API de dados (rest), arquivos (storage),
# painel (studio + meta) e o gateway (envoy). Sem realtime, edge functions, logs/analytics,
# pooler e imgproxy. As versoes das imagens sao as do compose oficial nesse commit.
#
# Nada e publicado direto na maquina: o Caddy do portal fala com o gateway pela rede "log20".
#   - API (PORTAL_SUPABASE_PORTA_API, padrao 8111): so /rest/v1, /auth/v1 e /storage/v1, sem
#     login do portal (as chaves e as regras RLS protegem os dados, como na nuvem);
#   - Studio (solucao supabase-studio, 8112): atras do login do portal e do usuario do painel.
# Os segredos (SUPABASE_*) sao gerados uma vez por "python -m marketplace supabase preparar".
# Os dados ficam nos volumes log20-supabase-*: atualizar ou recriar os containers nao os apaga.

name: log20-supabase

x-banco: &banco
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: postgres

services:

  db:
    container_name: log20-supabase-db
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
      - ./volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - dados:/var/lib/postgresql/data
      - config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: "5432"
      POSTGRES_PORT: "5432"
      PGPASSWORD: ${SUPABASE_POSTGRES_SENHA:?rode python -m marketplace supabase preparar}
      POSTGRES_PASSWORD: ${SUPABASE_POSTGRES_SENHA}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${SUPABASE_JWT_EXPIRA:-3600}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

  auth:
    container_name: log20-supabase-auth
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${SUPABASE_URL_PUBLICA:?rode python -m marketplace supabase preparar}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${SUPABASE_POSTGRES_SENHA}@db:5432/postgres
      # Endereco do sistema que usa o login (links de confirmacao/recuperacao de senha).
      GOTRUE_SITE_URL: ${SUPABASE_SITE_URL:-${SUPABASE_URL_PUBLICA}}
      GOTRUE_URI_ALLOW_LIST: ${SUPABASE_REDIRECTS:-}
      # Cadastro ligado: o Panorama cria usuarios pela tela de Administracao (signUp). Confirmacao
      # de e-mail automatica, porque o servidor nao envia e-mail (sem SMTP configurado).
      GOTRUE_DISABLE_SIGNUP: ${SUPABASE_DESLIGAR_CADASTRO:-false}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${SUPABASE_CONFIRMAR_EMAIL_AUTOMATICO:-true}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${SUPABASE_JWT_EXPIRA:-3600}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?rode python -m marketplace supabase preparar}
      GOTRUE_JWT_ISSUER: ${SUPABASE_URL_PUBLICA}
      # E-mail (opcional): sem isto, "esqueci a senha" nao manda e-mail.
      GOTRUE_SMTP_ADMIN_EMAIL: ${SUPABASE_SMTP_REMETENTE:-}
      GOTRUE_SMTP_HOST: ${SUPABASE_SMTP_SERVIDOR:-}
      GOTRUE_SMTP_PORT: ${SUPABASE_SMTP_PORTA:-587}
      GOTRUE_SMTP_USER: ${SUPABASE_SMTP_USUARIO:-}
      GOTRUE_SMTP_PASS: ${SUPABASE_SMTP_SENHA:-}
      GOTRUE_SMTP_SENDER_NAME: ${SUPABASE_SMTP_NOME:-Portal LOG20}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

  rest:
    container_name: log20-supabase-rest
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${SUPABASE_POSTGRES_SENHA}@db:5432/postgres
      PGRST_DB_SCHEMAS: ${SUPABASE_ESQUEMAS_API:-public,graphql_public}
      PGRST_DB_MAX_ROWS: ${SUPABASE_MAX_LINHAS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${SUPABASE_JWT_EXPIRA:-3600}
    command: ["postgrest"]

  storage:
    container_name: log20-supabase-storage
    image: supabase/storage-api:v1.89.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://storage:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY:?rode python -m marketplace supabase preparar}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?rode python -m marketplace supabase preparar}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${SUPABASE_POSTGRES_SENHA}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${SUPABASE_URL_PUBLICA}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: ${SUPABASE_TAMANHO_MAX_ARQUIVO:-52428800}
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ACCESS_KEY_ID: ${SUPABASE_S3_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${SUPABASE_S3_SEGREDO}
    volumes:
      - arquivos:/var/lib/storage

  meta:
    container_name: log20-supabase-meta
    image: supabase/postgres-meta:v0.100.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${SUPABASE_POSTGRES_SENHA}
      CRYPTO_KEY: ${SUPABASE_META_CHAVE:?rode python -m marketplace supabase preparar}

  studio:
    container_name: log20-supabase-studio
    image: supabase/studio:2026.11.02-sha-a05e7ec
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      <<: *banco
      POSTGRES_PASSWORD: ${SUPABASE_POSTGRES_SENHA}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${SUPABASE_META_CHAVE}
      PGRST_DB_SCHEMAS: ${SUPABASE_ESQUEMAS_API:-public,graphql_public}
      PGRST_DB_MAX_ROWS: ${SUPABASE_MAX_LINHAS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: public
      DEFAULT_ORGANIZATION_NAME: LOG20
      DEFAULT_PROJECT_NAME: Supabase do servidor
      OPENAI_API_KEY: ""
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_URL_PUBLICA}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
    volumes:
      - snippets:/app/snippets

  # Gateway (Envoy, o padrao do compose oficial): junta login, API, arquivos e painel num endereco
  # so e confere as chaves. Os arquivos de configuracao em volumes/api/envoy sao os oficiais.
  api-gw:
    container_name: log20-supabase-gw
    image: envoyproxy/envoy:v1.39.6
    restart: unless-stopped
    networks:
      default:
        aliases: [envoy, kong]
      log20: {}
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      studio:
        condition: service_healthy
      auth:
        condition: service_started
      rest:
        condition: service_started
      storage:
        condition: service_started
    volumes:
      - ./volumes/api/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./volumes/api/envoy/cds.yaml:/etc/envoy/cds.yaml:ro
      - ./volumes/api/envoy/lds.template.yaml:/etc/envoy/lds.template.yaml:ro
      - ./volumes/api/envoy/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      ANON_KEY_ASYMMETRIC: ""
      SERVICE_ROLE_KEY_ASYMMETRIC: ""
      SUPABASE_PUBLIC_URL: ${SUPABASE_URL_PUBLICA}
      DASHBOARD_USERNAME: ${SUPABASE_PAINEL_USUARIO:-supabaselog}
      DASHBOARD_PASSWORD: ${SUPABASE_PAINEL_SENHA:?rode python -m marketplace supabase preparar}
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]

networks:
  # Rede do portal (criada pelo docker-compose.yml da raiz): por ela o Caddy chega ao gateway.
  log20:
    external: true
    name: log20

volumes:
  dados:
    name: log20-supabase-dados
  config:
    name: log20-supabase-config
  arquivos:
    name: log20-supabase-arquivos
  snippets:
    name: log20-supabase-snippets
